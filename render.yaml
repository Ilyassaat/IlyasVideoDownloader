services:
  - type: web
    name: ilyasvideodownloader
    runtime: python
    plan: free

    buildCommand: |
      pip install -r requirements.txt
      rm -rf bgutil
      git clone --depth 1 --branch 1.3.1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git bgutil
      cd bgutil/server
      npm ci
      npx tsc

    startCommand: |
      node bgutil/server/build/main.js --port 4416 &
      gunicorn app:app --bind 0.0.0.0:$PORT

    healthCheckPath: /api/health
