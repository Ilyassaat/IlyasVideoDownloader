services:
  - type: web
    name: ilyasvideodownloader
    runtime: python
    plan: free
    buildCommand: >
      pip install -r requirements.txt &&
      rm -rf bgutil-ytdlp-pot-provider &&
      git clone --depth 1 --branch 1.3.1
      https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git
      bgutil-ytdlp-pot-provider &&
      cd bgutil-ytdlp-pot-provider/server &&
      npm ci &&
      npx tsc
    startCommand: >
      node bgutil-ytdlp-pot-provider/server/build/main.js --port 4416 &
      gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 900
    healthCheckPath: /api/health
    autoDeploy: true
