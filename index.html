<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>İlyas Downloader</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top left, #242424 0%, transparent 35%),
                radial-gradient(circle at bottom right, #171717 0%, transparent 40%),
                #090909;
            color: white;
        }

        .container {
            width: min(900px, 94%);
            margin: auto;
            padding: 55px 0;
        }

        .logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo h1 {
            margin: 0;
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .logo h1 span {
            color: #ff3b30;
        }

        .logo p {
            margin-top: 10px;
            color: #999;
            font-size: 15px;
        }

        .card {
            background: rgba(25, 25, 25, 0.94);
            border: 1px solid #303030;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 70px rgba(0, 0, 0, 0.45);
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        #url {
            flex: 1;
            height: 58px;
            padding: 0 18px;
            border-radius: 12px;
            border: 1px solid #383838;
            background: #111;
            color: white;
            outline: none;
            font-size: 16px;
        }

        #url:focus {
            border-color: #ff3b30;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 0 24px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .info-btn {
            background: #ff3b30;
            color: white;
            min-width: 150px;
        }

        button:hover {
            transform: translateY(-1px);
            opacity: 0.92;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 30px 10px 10px;
            color: #aaa;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #333;
            border-top-color: #ff3b30;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #result {
            display: none;
            margin-top: 25px;
        }

        .video-info {
            display: flex;
            gap: 20px;
            padding: 18px;
            background: #111;
            border-radius: 15px;
            border: 1px solid #2b2b2b;
        }

        .thumbnail {
            width: 260px;
            height: 146px;
            object-fit: cover;
            border-radius: 10px;
            background: #222;
        }

        .video-details {
            flex: 1;
        }

        .video-title {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.35;
            margin-bottom: 10px;
        }

        .video-meta {
            color: #888;
            font-size: 14px;
        }

        .quality-title {
            margin: 25px 0 12px;
            font-size: 16px;
            font-weight: 700;
        }

        #formats {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .format {
            padding: 15px;
            background: #151515;
            border: 1px solid #333;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .format:hover {
            border-color: #ff3b30;
        }

        .format.selected {
            border-color: #ff3b30;
            background: #241313;
        }

        .format-quality {
            font-size: 18px;
            font-weight: 800;
        }

        .format-type {
            margin-top: 5px;
            color: #888;
            font-size: 13px;
        }

        .download-btn {
            width: 100%;
            height: 58px;
            margin-top: 20px;
            background: #22c55e;
            color: white;
            font-size: 16px;
        }

        .error {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            background: #351414;
            border: 1px solid #702020;
            color: #ff8f8f;
            line-height: 1.5;
            word-break: break-word;
        }

        .success {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            background: #102b1a;
            border: 1px solid #1d6637;
            color: #7ee2a0;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #555;
            font-size: 13px;
        }

        @media (max-width: 650px) {
            .container {
                padding: 30px 0;
            }

            .logo h1 {
                font-size: 32px;
            }

            .input-row {
                flex-direction: column;
            }

            .info-btn {
                height: 55px;
            }

            .video-info {
                flex-direction: column;
            }

            .thumbnail {
                width: 100%;
                height: auto;
                aspect-ratio: 16 / 9;
            }

            #formats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        <h1>İlyas <span>Downloader</span></h1>
        <p>Video bağlantısını yapıştır, kaliteyi seç ve indir.</p>
    </div>

    <div class="card">

        <div class="input-row">
            <input
                id="url"
                type="text"
                placeholder="YouTube video bağlantısını buraya yapıştır..."
                autocomplete="off"
            >

            <button
                id="infoBtn"
                class="info-btn"
                onclick="getInfo()"
            >
                Videoyu Getir
            </button>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Video bilgileri alınıyor...</p>
        </div>

        <div id="error" class="error"></div>

        <div id="result">

            <div class="video-info">

                <img
                    id="thumbnail"
                    class="thumbnail"
                    src=""
                    alt="Video"
                >

                <div class="video-details">

                    <div
                        id="title"
                        class="video-title"
                    >
                        Video
                    </div>

                    <div
                        id="meta"
                        class="video-meta"
                    >
                    </div>

                </div>

            </div>

            <div class="quality-title">
                Video Kalitesi
            </div>

            <div id="formats"></div>

            <button
                id="downloadBtn"
                class="download-btn"
                onclick="downloadVideo()"
                disabled
            >
                📥 Videoyu İndir
            </button>

            <div id="success" class="success"></div>

        </div>

    </div>

    <div class="footer">
        İlyas Downloader
    </div>

</div>


<script>

let currentUrl = "";
let selectedFormat = null;


function showError(message) {

    const error = document.getElementById("error");

    error.style.display = "block";
    error.textContent = "Hata: " + message;
}


function hideError() {

    const error = document.getElementById("error");

    error.style.display = "none";
    error.textContent = "";
}


function showLoading(show) {

    document.getElementById("loading").style.display =
        show ? "block" : "none";

    document.getElementById("infoBtn").disabled = show;
}


async function getInfo() {

    hideError();

    document.getElementById("success").style.display = "none";

    const url =
        document.getElementById("url").value.trim();

    if (!url) {

        showError("Önce bir video bağlantısı gir.");

        return;
    }

    currentUrl = url;

    selectedFormat = null;

    document.getElementById("result").style.display = "none";

    showLoading(true);

    try {

        const response = await fetch(
            "/api/info",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    url: url
                })
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {

            throw new Error(
                data.error || "Video bilgileri alınamadı."
            );
        }

        showVideo(data);

    } catch (error) {

        showError(error.message);

    } finally {

        showLoading(false);
    }
}


function showVideo(data) {

    document.getElementById("result").style.display =
        "block";

    document.getElementById("title").textContent =
        data.title || "Video";

    document.getElementById("thumbnail").src =
        data.thumbnail || "";

    let meta = "";

    if (data.uploader) {
        meta += data.uploader;
    }

    if (data.duration) {

        if (meta) {
            meta += " • ";
        }

        meta += formatDuration(data.duration);
    }

    document.getElementById("meta").textContent =
        meta;

    const formats =
        document.getElementById("formats");

    formats.innerHTML = "";

    const unique =
        new Map();

    for (const format of data.formats || []) {

        const height =
            format.height || 0;

        if (!height) {
            continue;
        }

        const key =
            height + "-" + format.ext;

        if (!unique.has(key)) {
            unique.set(key, format);
        }
    }

    const list =
        Array.from(unique.values());

    list.sort(
        (a, b) =>
            (b.height || 0) -
            (a.height || 0)
    );

    for (const format of list) {

        const item =
            document.createElement("div");

        item.className = "format";

        item.innerHTML = `
            <div class="format-quality">
                ${format.height}p
            </div>

            <div class="format-type">
                ${format.ext.toUpperCase()}
                ${format.fps ? " • " + format.fps + " FPS" : ""}
            </div>
        `;

        item.onclick = () => {

            document
                .querySelectorAll(".format")
                .forEach(el =>
                    el.classList.remove("selected")
                );

            item.classList.add("selected");

            selectedFormat =
                format.format_id;

            document.getElementById(
                "downloadBtn"
            ).disabled = false;
        };

        formats.appendChild(item);
    }

    if (list.length > 0) {

        const first =
            formats.firstElementChild;

        first.click();

    } else {

        document.getElementById(
            "downloadBtn"
        ).disabled = false;
    }
}


async function downloadVideo() {

    hideError();

    document.getElementById(
        "success"
    ).style.display = "none";

    if (!currentUrl) {

        showError(
            "Önce video bağlantısını gir."
        );

        return;
    }

    const button =
        document.getElementById(
            "downloadBtn"
        );

    button.disabled = true;

    button.textContent =
        "⏳ İndiriliyor...";

    try {

        const response =
            await fetch(
                "/api/download",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        url: currentUrl,
                        format_id: selectedFormat
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok || !data.success) {

            throw new Error(
                data.error ||
                "Video indirilemedi."
            );
        }

        const success =
            document.getElementById(
                "success"
            );

        success.style.display =
            "block";

        success.innerHTML =
            `İndirme tamamlandı: <strong>${escapeHtml(data.filename)}</strong>`;

        /*
         * Dosyanın tarayıcıya indirilmesini başlat.
         */
        const link =
            document.createElement("a");

        link.href =
            data.download_url;

        link.download =
            data.filename;

        document.body.appendChild(link);

        link.click();

        link.remove();

    } catch (error) {

        showError(error.message);

    } finally {

        button.disabled = false;

        button.textContent =
            "📥 Videoyu İndir";
    }
}


function formatDuration(seconds) {

    seconds =
        Number(seconds);

    if (!Number.isFinite(seconds)) {
        return "";
    }

    const hours =
        Math.floor(seconds / 3600);

    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );

    const secs =
        Math.floor(
            seconds % 60
        );

    if (hours > 0) {

        return (
            String(hours).padStart(2, "0") +
            ":" +
            String(minutes).padStart(2, "0") +
            ":" +
            String(secs).padStart(2, "0")
        );

    }

    return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(secs).padStart(2, "0")
    );
}


function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;
}


document
    .getElementById("url")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {
                getInfo();
            }

        }
    );

</script>

</body>
</html>
